<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" fill="none" aria-hidden="true">
  <!-- Carbonix — carbonation field.
       Outlined bubbles only, no fill: the motif has to sit on top of
       photography and glass without hiding either. Stroke widths scale with
       radius so the small ones stay hairline instead of turning into dots.
       currentColor throughout, so one file serves every tint. -->
  <g stroke="currentColor" stroke-opacity=".55">
    <circle cx="148"  cy="132" r="54"  stroke-width="1.4"/>
    <circle cx="252"  cy="286" r="27"  stroke-width="1.1"/>
    <circle cx="96"   cy="372" r="15"  stroke-width=".9"/>
    <circle cx="330"  cy="118" r="10"  stroke-width=".8"/>
    <circle cx="404"  cy="246" r="41"  stroke-width="1.25"/>
    <circle cx="196"  cy="556" r="33"  stroke-width="1.15"/>
    <circle cx="322"  cy="676" r="19"  stroke-width="1"/>
    <circle cx="88"   cy="700" r="46"  stroke-width="1.3"/>
    <circle cx="486"  cy="512" r="13"  stroke-width=".85"/>
    <circle cx="560"  cy="128" r="23"  stroke-width="1.05"/>
    <circle cx="628"  cy="344" r="62"  stroke-width="1.5"/>
    <circle cx="536"  cy="762" r="30"  stroke-width="1.1"/>
    <circle cx="714"  cy="602" r="17"  stroke-width=".95"/>
    <circle cx="792"  cy="196" r="38"  stroke-width="1.2"/>
    <circle cx="880"  cy="430" r="24"  stroke-width="1.05"/>
    <circle cx="742"  cy="812" r="11"  stroke-width=".8"/>
    <circle cx="968"  cy="656" r="50"  stroke-width="1.35"/>
    <circle cx="1052" cy="288" r="16"  stroke-width=".9"/>
    <circle cx="1108" cy="482" r="29"  stroke-width="1.1"/>
    <circle cx="1016" cy="96"  r="21"  stroke-width="1"/>
    <circle cx="1148" cy="742" r="13"  stroke-width=".85"/>
    <circle cx="640"  cy="60"  r="9"   stroke-width=".75"/>
    <circle cx="424"  cy="836" r="22"  stroke-width="1.05"/>
    <circle cx="860"  cy="712" r="9"   stroke-width=".75"/>
  </g>
  <!-- A few carry an inner arc: the specular highlight a real bubble has.
       Only on the large ones, where there is room for it to read. -->
  <g stroke="currentColor" stroke-opacity=".34" stroke-linecap="round" fill="none">
    <path d="M119 106a54 54 0 0 1 24-22"      stroke-width="1.5"/>
    <path d="M596 316a62 62 0 0 1 28-26"      stroke-width="1.6"/>
    <path d="M62 678a46 46 0 0 1 21-19"       stroke-width="1.4"/>
    <path d="M941 634a50 50 0 0 1 23-21"      stroke-width="1.45"/>
    <path d="M382 230a41 41 0 0 1 19-17"      stroke-width="1.3"/>
  </g>
</svg>
